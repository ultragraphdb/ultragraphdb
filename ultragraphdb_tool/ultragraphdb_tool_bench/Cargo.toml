[package]
name = "ultragraphdb_tool_bench"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
autotests = false
autobins = false

[lints]
workspace = true

[dependencies]
ultragraphdb_common_telemetry = { workspace = true }
oxrdf = { workspace = true }
ultragraphdb_core_ids = { workspace = true }
ultragraphdb_core_keys = { workspace = true }
ultragraphdb_core_mapping = { workspace = true }
ultragraphdb_core_terms = { workspace = true }
ultragraphdb_error_store = { workspace = true }
ultragraphdb_store_apply = { workspace = true }
ultragraphdb_store_kv = { workspace = true }
ultragraphdb_store_posting = { workspace = true }
ultragraphdb_traits_blocks = { workspace = true }
ultragraphdb_traits_store = { workspace = true }
ultragraphdb_traits_log = { workspace = true }
ultragraphdb_transactions_commit = { workspace = true }
ultragraphdb_transactions_log = { workspace = true }
ultragraphdb_transactions_txn = { workspace = true }
compio = { workspace = true }
mimalloc = { workspace = true }

[dev-dependencies]
ultragraphdb_tool_bdd = { workspace = true }
serde_json = { workspace = true }

# Drives the apply thread and the store at a fixed rate and prints what it measured; never run by a test.
[[bin]]
name = "store_bench"
path = "src/bin/store_bench.rs"

# Drives stage 5's commit pipeline, the write-ahead log and fjall, at a fixed rate and prints what it measured; never
# run by a test.
[[bin]]
name = "wal_bench"
path = "src/bin/wal_bench.rs"

[[test]]
name = "unit"
path = "tests/mod.rs"
