[package]
name = "ultragraphdb_common_frontend"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The UltraGraphDB frontend role"
publish.workspace = true
autotests = false

[lints]
workspace = true

[features]
default = []
test-utils = []

[dependencies]
compio = { workspace = true }
futures = { workspace = true }
getrandom = { workspace = true }
oxilangtag = { workspace = true }
oxrdf = { workspace = true }
oxsdatatypes = { workspace = true }
ultragraphdb_core_catalog = { workspace = true }
ultragraphdb_core_mapping = { workspace = true }
ultragraphdb_core_terms = { workspace = true }
ultragraphdb_traits_catalog = { workspace = true }
ultragraphdb_cluster_metadata = { workspace = true }
ultragraphdb_cluster_placement = { workspace = true }
ultragraphdb_cluster_sequencer = { workspace = true }
ultragraphdb_core_ids = { workspace = true }
ultragraphdb_error_cluster = { workspace = true }
ultragraphdb_error_protocol = { workspace = true }
ultragraphdb_traits_log = { workspace = true }
ultragraphdb_transactions_log = { workspace = true }
tracing = { workspace = true }
ultragraphdb_common_service = { workspace = true }
ultragraphdb_common_service_config = { workspace = true }
ultragraphdb_error_role = { workspace = true }
ultragraphdb_protocol_scram = { workspace = true }
ultragraphdb_common_role = { workspace = true }
ultragraphdb_protocol_transport = { workspace = true }
ultragraphdb_protocol_transport_compio = { workspace = true }
ultragraphdb_protocol_wire = { workspace = true }

[dev-dependencies]
cucumber = { workspace = true }
ultragraphdb_common_frontend = { path = ".", features = ["test-utils"] }
ultragraphdb_tool_bdd = { workspace = true }
ultragraphdb_transport_tls = { workspace = true, features = ["test-utils"] }

[[test]]
name = "unit"
path = "tests/mod.rs"

[[test]]
name = "bdd"
path = "tests/bdd.rs"
harness = false
