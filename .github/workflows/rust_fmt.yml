# Checks the Rust formatting `make format` writes: the root workspace and the fuzz workspace, which the root excludes.

name: Fmt

on: [ pull_request ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo fmt --all --manifest-path fuzz/Cargo.toml -- --check
