{{- /*
The four Secrets, each drawn at random at the first install and kept since: an upgrade reads the value back, and an uninstall
leaves it, as the volumes the roles' data lives on stay and the frontend's metadata holds the bootstrap administrator's verifier.
`helm template` reads no cluster, so each render draws anew; scripts/cluster_local.sh therefore creates these only where absent.
*/ -}}
{{- if .Values.secrets.create }}
{{- range $name, $file := dict "read-key" "read.key" "admin-key" "admin.key" "role-secret" "role.secret" "bootstrap-secret" "bootstrap.secret" }}
{{- $fullname := printf "ultragraphdb-%s" $name }}
{{- $existing := lookup "v1" "Secret" $.Release.Namespace $fullname }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "ultragraphdb.labels" (dict "name" "secrets" "root" $) | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing (hasKey $existing.data $file) }}
  {{ $file }}: {{ index $existing.data $file }}
  {{- else }}
  {{ $file }}: {{ randAlphaNum 64 | b64enc }}
  {{- end }}
{{- end }}
{{- end }}
