{{- /*
The storage instance `storage`, one partition: a StatefulSet of one replica per instance, as an instance's name comes from its
environment and a StatefulSet's ordinal names no instance. Its role address is its pod's name under the headless Service
`storage`, so a restart on another IP keeps the address the frontend holds. A pod recovering its log answers /health and not
/ready until the replay ends: the startup probe waits for /health alone, so a long replay keeps the pod alive and unready.
*/ -}}
apiVersion: v1
kind: Service
metadata:
  name: storage
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ultragraphdb.labels" (dict "name" "storage" "root" .) | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "ultragraphdb.selector" (dict "name" "storage") | nindent 4 }}
  ports:
    - name: role
      port: 7100
    - name: observability
      port: 8083
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: storage
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ultragraphdb.labels" (dict "name" "storage" "root" .) | nindent 4 }}
spec:
  serviceName: storage
  replicas: 1
  selector:
    matchLabels:
      {{- include "ultragraphdb.selector" (dict "name" "storage") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ultragraphdb.labels" (dict "name" "storage" "root" .) | nindent 8 }}
    spec:
      {{- include "ultragraphdb.podSecurity" (dict "user" 65532 "root" .) | nindent 6 }}
      containers:
        - name: storage
          image: {{ .Values.images.storage }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          # The last lines of a failed start's log stay in the pod's status, naming what stopped it.
          terminationMessagePolicy: FallbackToLogsOnError
          env:
            {{- include "ultragraphdb.bootstrap" (dict "name" "storage" "root" .) | nindent 12 }}
          ports:
            - {name: role, containerPort: 7100}
            - {name: observability, containerPort: 8083}
          {{- include "ultragraphdb.containerSecurity" . | nindent 10 }}
          {{- include "ultragraphdb.probes" (dict "port" 8083 "startup" 90) | nindent 10 }}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: secrets, mountPath: /secrets, readOnly: true}
      volumes:
        # Each Secret optional, so a missing one leaves its file absent and the role names it as it exits with code 78, rather
        # than the pod waiting unstarted.
        - name: secrets
          projected:
            defaultMode: 0440
            sources:
              - secret: {name: ultragraphdb-read-key, optional: true}
              - secret: {name: ultragraphdb-role-secret, optional: true}
  {{- include "ultragraphdb.dataClaim" . | nindent 2 }}
