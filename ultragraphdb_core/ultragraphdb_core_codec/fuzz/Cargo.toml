# The cargo-fuzz package of ultragraphdb_core_codec, run by scripts/fuzz.sh: outside the workspace and outside Bazel,
# so its dependencies are pinned here, workspace inheritance not reaching it.

[package]
name = "ultragraphdb_core_codec_fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# A workspace of its own: the fuzz package is no member of the repository's.
[workspace]
members = ["."]

[dependencies]
ultragraphdb_core_codec = { path = ".." }
ultragraphdb_error_store = { path = "../../../ultragraphdb_error/ultragraphdb_error_store" }
libfuzzer-sys = "=0.4.13"
# The version of the `arbitrary` libfuzzer-sys builds its inputs with, the workspace's pin.
arbitrary = "=1.5.0"
xxhash-rust = { version = "=0.8.19", features = ["xxh3"] }

[[bin]]
name = "posting_list_decode"
path = "fuzz_targets/posting_list_decode.rs"
test = false
doc = false
bench = false
