[package]
name = "ultragraphdb_transactions_log"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
autotests = false

[lints]
workspace = true

[features]
default = []
test-utils = []

[dependencies]
ultragraphdb_traits_log = { workspace = true }
ultragraphdb_error_log = { workspace = true }
ultragraphdb_error_protocol = { workspace = true }
ultragraphdb_protocol_wire = { workspace = true }
# External crates
compio = { workspace = true }
tracing = { workspace = true }
# fallocate(2) for a new segment; macOS reserves nothing.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true }

[dev-dependencies]
# The crate's own test utilities, so its suite tests them under Cargo as under Bazel.
ultragraphdb_transactions_log = { path = ".", features = ["test-utils"] }
ultragraphdb_tool_bdd = { workspace = true }
# External crates
cucumber = { workspace = true }
futures = { workspace = true }
tracing-subscriber = { workspace = true }
xxhash-rust = { workspace = true }

[[test]]
name = "unit"
path = "tests/mod.rs"

[[test]]
name = "bdd"
path = "tests/bdd.rs"
harness = false
