[package]
name = "ultragraphdb_store_apply"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
autotests = false

[lints]
workspace = true

[dependencies]
oxrdf = { workspace = true }
oxsdatatypes = { workspace = true }
ultragraphdb_core_mapping = { workspace = true }
ultragraphdb_core_terms = { workspace = true }
ultragraphdb_store_quads = { workspace = true }
ultragraphdb_core_keys = { workspace = true }
ultragraphdb_core_catalog = { workspace = true }
ultragraphdb_core_tok = { workspace = true }
ultragraphdb_core_types = { workspace = true }
ultragraphdb_error_store = { workspace = true }
ultragraphdb_proto_pb = { workspace = true }
ultragraphdb_store_hnsw = { workspace = true }
ultragraphdb_store_posting = { workspace = true }
ultragraphdb_traits_index = { workspace = true }
ultragraphdb_traits_store = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
ultragraphdb_store_sim = { workspace = true }
ultragraphdb_tool_bdd = { workspace = true }
ultragraphdb_tool_test = { workspace = true }
cucumber = { workspace = true }
futures = { workspace = true }

[[test]]
name = "unit"
path = "tests/mod.rs"

# The changeset workload's fixed seeds without faults, with faults, and a seed's replay: apart from the unit tests,
# one target each, so that they run beside each other.
[[test]]
name = "workload_seeds"
path = "tests/workload_seeds.rs"

[[test]]
name = "workload_faults"
path = "tests/workload_faults.rs"

[[test]]
name = "workload_replay"
path = "tests/workload_replay.rs"

[[test]]
name = "bdd"
path = "tests/bdd.rs"
harness = false
