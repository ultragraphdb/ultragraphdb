[package]
name = "ultragraphdb_store_kv"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
autotests = false
autobins = false
autobenches = false

[lints]
workspace = true

[dependencies]
ultragraphdb_error_store = { workspace = true }
ultragraphdb_traits_store = { workspace = true }
fjall = { workspace = true }
moka = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
ultragraphdb_store_sim = { workspace = true }
ultragraphdb_tool_bdd = { workspace = true }
ultragraphdb_tool_test = { workspace = true }
criterion = { workspace = true }
cucumber = { workspace = true }
futures = { workspace = true }

# Writes batches and drops into a store until it is killed: the crash test's data dependency.
[[bin]]
name = "kv_crash_writer"
path = "src/bin/kv_crash_writer.rs"

[[test]]
name = "unit"
path = "tests/mod.rs"

# A batch of 1 GiB, apart so that it runs beside the other tests rather than after them.
[[test]]
name = "batch_gib"
path = "tests/batch_gib.rs"

# Kills the writer binary during a batch, a drop, a temporary keyspace's life and a rebuild record's write, then
# reopens its store: one target each, so they run beside each other.
[[test]]
name = "crash"
path = "tests/crash.rs"

[[test]]
name = "crash_drop"
path = "tests/crash_drop.rs"

[[test]]
name = "crash_temporary"
path = "tests/crash_temporary.rs"

[[test]]
name = "crash_rebuild"
path = "tests/crash_rebuild.rs"

# The simulator's store workload run on fjall beside the simulated store, without faults and with crashes: apart
# from the unit tests, so that the two runs go beside them.
[[test]]
name = "fjall_workload_checks"
path = "tests/fjall_workload_checks.rs"

[[test]]
name = "fjall_workload_crashes"
path = "tests/fjall_workload_crashes.rs"

[[test]]
name = "bdd"
path = "tests/bdd.rs"
harness = false

# Criterion benches of the store alone, run by `cargo bench` and `bazel run`, never by `make test`.
[[bench]]
name = "kv_batch_write_bench"
harness = false

[[bench]]
name = "kv_point_read_bench"
harness = false

[[bench]]
name = "kv_prefix_scan_bench"
harness = false

[[bench]]
name = "kv_compact_bench"
harness = false

[[bench]]
name = "kv_drop_prefix_bench"
harness = false

[[bench]]
name = "kv_list_cache_bench"
harness = false
