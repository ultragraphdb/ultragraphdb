[package]
name = "ultragraphdb_cluster_metadata"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
autotests = false

[lints]
workspace = true

[dependencies]
ultragraphdb_cluster_placement = { workspace = true }
ultragraphdb_core_ids = { workspace = true }
ultragraphdb_error_cluster = { workspace = true }
ultragraphdb_error_log = { workspace = true }
ultragraphdb_protocol_scram = { workspace = true }
ultragraphdb_traits_blocks = { workspace = true }
ultragraphdb_traits_catalog = { workspace = true }
ultragraphdb_traits_log = { workspace = true }
xxhash-rust = { workspace = true }

# Loom's types under `--cfg loom`, which the Loom tests build the crate with (`tests/loom/`).
[target.'cfg(loom)'.dependencies]
loom = { workspace = true }

[dev-dependencies]
ultragraphdb_cluster_sequencer = { workspace = true }
ultragraphdb_protocol_wire = { workspace = true }
ultragraphdb_tool_bdd = { workspace = true }
ultragraphdb_transactions_log = { workspace = true }
cucumber = { workspace = true }
futures = { workspace = true }

[[test]]
name = "unit"
path = "tests/mod.rs"

[[test]]
name = "bdd"
path = "tests/bdd.rs"
harness = false
