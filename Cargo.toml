[workspace]
resolver = "2"
members = [
    "ultragraphdb/*",
    "ultragraphdb_client/*",
    "ultragraphdb_cluster/*",
    "ultragraphdb_common/*",
    "ultragraphdb_core/*",
    "ultragraphdb_error/*",
    "ultragraphdb_protocol/*",
    #    "ultragraphdb_schema/*",
    "ultragraphdb_store/*",
    "ultragraphdb_tool/*",
    "ultragraphdb_traits/*",
    "ultragraphdb_transactions/*",
    "ultragraphdb_transport/*",
]
# The cargo-fuzz is a dedicated workspace (fuzz/Cargo.toml): nightly-only, and libfuzzer-sys builds C++.
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/ultragraphdb/ultragraphdb.git"
authors = ["Marvin Hansen <marvin.hansen@gmail.com>"]
publish = false

