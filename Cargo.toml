[workspace.lints.clippy]
# The one lint table of the workspace: every crate takes it with `[lints] workspace = true`.
# It is Ultra Style's lint set (openspec/protocols/ULTRA_STYLE.md, "The lint set").
all = { level = "deny", priority = -1 }
infinite_iter = "deny"
maybe_infinite_iter = "deny"
shadow_unrelated = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "warn"  # unimplemented is used during TDD so warn simplifies the impl stage w/o blocking compilation.
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
cast_lossless = "deny"
wildcard_enum_match_arm = "deny"
large_types_passed_by_value = "deny"
trivially_copy_pass_by_ref = "deny"
needless_pass_by_value = "deny"
rc_buffer = "deny"
mutex_atomic = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
too_many_lines = "deny"   # too-many-lines-threshold = 70 set in clippy.toml.
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
disallowed_methods = "deny"

[workspace.lints.rust]
# `--cfg loom` builds a crate's shared counts on Loom's types for its Loom tests (`tests/loom/`).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }
unsafe_code = "forbid"
bare_trait_objects = "forbid"
deprecated_safe = { level = "warn", priority = -1 }
unused_must_use = "deny"
unused_results = "deny"
missing_docs = "deny"

[profile.release]
# Bazel needs these options seperately for its release build configuration
# in file .bazelrc and bazel/binary.bzl
opt-level = 3
debug = false
debug-assertions = false
rpath = false
lto = true
overflow-checks = true
# unwind preserves drop, which is critical for security code relying on drop.
panic = "unwind"
