[workspace]
resolver = "2"
members = [
    "ultragraphdb_client/*",
    "ultragraphdb_cluster/*",
    "ultragraphdb_common/*",
    "ultragraphdb_core/*",
    "ultragraphdb_error/*",
    "ultragraphdb_protocol/*",
    "ultragraphdb_store/*",
    "ultragraphdb_tool/*",
    "ultragraphdb_traits/*",
    "ultragraphdb_transactions/*",
    "ultragraphdb_transport/*",
]
# The cargo-fuzz is a dedicated workspace (fuzz/Cargo.toml): nightly-only, and libfuzzer-sys builds C++.
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/ultragraphdb/ultragraphdb.git"
authors = ["Marvin Hansen <marvin.hansen@gmail.com>"]
publish = false

[workspace.dependencies]
# ==============
# Internal crates
# ==============
## Client
ultragraphdb_client_core = { path = "ultragraphdb_client/ultragraphdb_client_core" }
ultragraphdb_client_compio = { path = "ultragraphdb_client/ultragraphdb_client_compio" }
ultragraphdb_client_tokio = { path = "ultragraphdb_client/ultragraphdb_client_tokio" }
## Cluster
ultragraphdb_cluster_placement = { path = "ultragraphdb_cluster/ultragraphdb_cluster_placement" }
ultragraphdb_cluster_sequencer = { path = "ultragraphdb_cluster/ultragraphdb_cluster_sequencer" }
## Common
ultragraphdb_common_telemetry = { path = "ultragraphdb_common/ultragraphdb_common_telemetry" }
ultragraphdb_common_utils = { path = "ultragraphdb_common/ultragraphdb_common_utils" }
ultragraphdb_common_version = { path = "ultragraphdb_common/ultragraphdb_common_version" }
## Core
ultragraphdb_core_algo = { path = "ultragraphdb_core/ultragraphdb_core_algo" }
ultragraphdb_core_catalog = { path = "ultragraphdb_core/ultragraphdb_core_catalog" }
ultragraphdb_core_codec = { path = "ultragraphdb_core/ultragraphdb_core_codec" }
ultragraphdb_core_ids = { path = "ultragraphdb_core/ultragraphdb_core_ids" }
ultragraphdb_core_keys = { path = "ultragraphdb_core/ultragraphdb_core_keys" }
ultragraphdb_core_mapping = { path = "ultragraphdb_core/ultragraphdb_core_mapping" }
ultragraphdb_core_terms = { path = "ultragraphdb_core/ultragraphdb_core_terms" }
ultragraphdb_core_text = { path = "ultragraphdb_core/ultragraphdb_core_text" }
ultragraphdb_core_tok = { path = "ultragraphdb_core/ultragraphdb_core_tok" }
ultragraphdb_core_types = { path = "ultragraphdb_core/ultragraphdb_core_types" }
## Error
ultragraphdb_error_cluster = { path = "ultragraphdb_error/ultragraphdb_error_cluster" }
ultragraphdb_error_json = { path = "ultragraphdb_error/ultragraphdb_error_json" }
ultragraphdb_error_log = { path = "ultragraphdb_error/ultragraphdb_error_log" }
ultragraphdb_error_invariant = { path = "ultragraphdb_error/ultragraphdb_error_invariant" }
ultragraphdb_error_num = { path = "ultragraphdb_error/ultragraphdb_error_num" }
ultragraphdb_error_options = { path = "ultragraphdb_error/ultragraphdb_error_options" }
ultragraphdb_error_protocol = { path = "ultragraphdb_error/ultragraphdb_error_protocol" }
ultragraphdb_error_store = { path = "ultragraphdb_error/ultragraphdb_error_store" }
## Protocol: the binary protocol client and server share
ultragraphdb_protocol_scram = { path = "ultragraphdb_protocol/ultragraphdb_protocol_scram" }
ultragraphdb_protocol_transport = { path = "ultragraphdb_protocol/ultragraphdb_protocol_transport" }
ultragraphdb_protocol_transport_compio = { path = "ultragraphdb_protocol/ultragraphdb_protocol_transport_compio" }
ultragraphdb_protocol_wire = { path = "ultragraphdb_protocol/ultragraphdb_protocol_wire" }
## Store: storage over the Store trait
ultragraphdb_store_apply = { path = "ultragraphdb_store/ultragraphdb_store_apply" }
ultragraphdb_store_hnsw = { path = "ultragraphdb_store/ultragraphdb_store_hnsw" }
ultragraphdb_store_kv = { path = "ultragraphdb_store/ultragraphdb_store_kv" }
ultragraphdb_store_posting = { path = "ultragraphdb_store/ultragraphdb_store_posting" }
ultragraphdb_store_quads = { path = "ultragraphdb_store/ultragraphdb_store_quads" }
ultragraphdb_store_sim = { path = "ultragraphdb_store/ultragraphdb_store_sim" }
## Tool
ultragraphdb_tool_bdd = { path = "ultragraphdb_tool/ultragraphdb_tool_bdd" }
ultragraphdb_tool_bench = { path = "ultragraphdb_tool/ultragraphdb_tool_bench" }
ultragraphdb_tool_test = { path = "ultragraphdb_tool/ultragraphdb_tool_test" }
ultragraphdb_tool_toml = { path = "ultragraphdb_tool/ultragraphdb_tool_toml" }
## Traits
ultragraphdb_traits_blocks = { path = "ultragraphdb_traits/ultragraphdb_traits_blocks" }
ultragraphdb_traits_collator = { path = "ultragraphdb_traits/ultragraphdb_traits_collator" }
ultragraphdb_traits_index = { path = "ultragraphdb_traits/ultragraphdb_traits_index" }
ultragraphdb_traits_log = { path = "ultragraphdb_traits/ultragraphdb_traits_log" }
ultragraphdb_traits_store = { path = "ultragraphdb_traits/ultragraphdb_traits_store" }
## Transactions
ultragraphdb_transactions_commit = { path = "ultragraphdb_transactions/ultragraphdb_transactions_commit" }
ultragraphdb_transactions_log = { path = "ultragraphdb_transactions/ultragraphdb_transactions_log" }
ultragraphdb_transactions_txn = { path = "ultragraphdb_transactions/ultragraphdb_transactions_txn" }
## Transport
ultragraphdb_transport_tls = { path = "ultragraphdb_transport/ultragraphdb_transport_tls" }
# ==============
# External crates
# ==============
serde_json = "1.0"
tokio = "1.54"
bcrypt = "0.19"
dashu-int = "0.6"
rust-stemmers = "1.2"
serde = { version = "1.0", features = ["derive"] }
unicode-normalization = "0.1"
oxrdf = { version = "0.3", features = ["rdf-12"] }
oxsdatatypes = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "json", "env-filter"] }
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "trace"] }
opentelemetry-http = { version = "0.33", default-features = false }
async-trait = "0.1"
tracing-opentelemetry = { version = "0.34", default-features = false }
fjall = "3.1"
moka = { version = "0.12", features = ["sync"] }
sha2 = "0.11"
hmac = "0.13"
subtle = "2.6"
base64 = "0.23"
stringprep = "0.1"
getrandom = "0.4"
futures = "0.3"
compio = { version = "0.19", default-features = false, features = ["runtime", "io-uring", "fs", "net", "time"] }
# The allocator of every shipped binary, set as its `#[global_allocator]`: musl's own allocator contends under threads,
# measured 31% fewer commits per second than glibc's on `wal_bench` (2026-11-01). 
mimalloc = { version = "0.1", features = ["local_dynamic_tls"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
rustix = { version = "1.1", default-features = false, features = ["fs"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std"] }
rustls-pki-types = { version = "1", features = ["std"] }
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
# ==============
# Dev only crates
# ==============
arbitrary = { version = "1.5", features = ["derive"] }
cucumber = "0.23"
criterion = { version = "0.8", default-features = false }


[workspace.lints.clippy]
# The one lint table of the workspace: every crate takes it with `[lints] workspace = true`.
# It is Ultra Style's lint set (openspec/protocols/ULTRA_STYLE.md, "The lint set"). A lint the crates do not meet yet
# stays here commented out, with its count of violations on 2026-11-02.
all = { level = "deny", priority = -1 }
# Rule 2.
infinite_iter = "deny"
maybe_infinite_iter = "deny"
# Rule 6.
shadow_unrelated = "deny"
# Rule 7.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "warn"  # unimplemented is used during TDD so warn simplifies the impl stage w/o blocking compilation.
#indexing_slicing = "deny"                  # 1018
#arithmetic_side_effects = "deny"           # 1778; Ultra asks it in decoders and parsers
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
# Types.
#cast_possible_truncation = "deny"          # 355
#cast_sign_loss = "deny"                    # 118
cast_possible_wrap = "deny"
cast_lossless = "deny"
wildcard_enum_match_arm = "deny"
# Rule 9.
large_types_passed_by_value = "deny"
trivially_copy_pass_by_ref = "deny"
needless_pass_by_value = "deny"
rc_buffer = "deny"
mutex_atomic = "deny"
# Rule 10.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
too_many_lines = "deny"   # too-many-lines-threshold = 70 in clippy.toml.
# Concurrency.
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
disallowed_methods = "deny"

[workspace.lints.rust]
unsafe_code = "forbid"
deprecated_safe = { level = "warn", priority = -1 }
# Rule 7.
unused_must_use = "deny"
unused_results = "deny"
# Documentation
missing_docs = "deny"

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
# unwind preserves drop, which is critical for security code relying on drop.
panic = "unwind"
