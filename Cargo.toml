[workspace]
resolver = "2"
members = [
    "ugdb_client/*",
    "ugdb_common/*",
    "ugdb_proto/*",
]

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/marvin-hansen/ultragraphdb"
authors = ["Marvin Hansen <marvin.hansen@gmail.com>"]
publish = false


[workspace.dependencies]
# ==============
# Internal crates
# ==============
## Common
common_version = { path = "ugdb_common/common_version" }
## Client
ultragraph_client = { path = "ugdb_client/ultragraph_client" }
## Proto
proto_dgraph = { path = "ugdb_proto/proto_dgraph" }

# ==============
# External crates
# ==============
docker_utils = "0.3"
prost = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12"] }
serde_json = "1.0"
tokio = "1"
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
ureq = "3.3"


[workspace.lints.clippy]
all = "warn"
# Repo-wide lint policy. Member crates opt in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"
deprecated_safe = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
# unwind preserves drop, which is critical for security code relying on drop.
panic = "unwind"
