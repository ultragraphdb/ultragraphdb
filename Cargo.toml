[workspace]
resolver = "2"
members = [
    #"ultragraphdb_client/*", # reserved for later
    "ultragraphdb_common/*",
    "ultragraphdb_core/*",
    "ultragraphdb_error/*",
    "ultragraphdb_proto/*",
    "ultragraphdb_store/*",
    "ultragraphdb_test/*",
    "ultragraphdb_tool/*",
    "ultragraphdb_traits/*",
]

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/causalcenter/ultragraphdb.git"
authors = ["Marvin Hansen <marvin.hansen@gmail.com>"]
publish = false

[workspace.dependencies]
# ==============
# Internal crates
# ==============
## Client
# TBDs
## Common
ultragraphdb_common_telemetry = { path = "ultragraphdb_common/ultragraphdb_common_telemetry" }
ultragraphdb_common_utils = { path = "ultragraphdb_common/ultragraphdb_common_utils" }
ultragraphdb_common_version = { path = "ultragraphdb_common/ultragraphdb_common_version" }
## Core
ultragraphdb_core_algo = { path = "ultragraphdb_core/ultragraphdb_core_algo" }
ultragraphdb_core_catalog = { path = "ultragraphdb_core/ultragraphdb_core_catalog" }
ultragraphdb_core_codec = { path = "ultragraphdb_core/ultragraphdb_core_codec" }
ultragraphdb_core_keys = { path = "ultragraphdb_core/ultragraphdb_core_keys" }
ultragraphdb_core_mapping = { path = "ultragraphdb_core/ultragraphdb_core_mapping" }
ultragraphdb_core_terms = { path = "ultragraphdb_core/ultragraphdb_core_terms" }
ultragraphdb_core_text = { path = "ultragraphdb_core/ultragraphdb_core_text" }
ultragraphdb_core_tok = { path = "ultragraphdb_core/ultragraphdb_core_tok" }
ultragraphdb_core_types = { path = "ultragraphdb_core/ultragraphdb_core_types" }
## Error
ultragraphdb_error_json = { path = "ultragraphdb_error/ultragraphdb_error_json" }
ultragraphdb_error_num = { path = "ultragraphdb_error/ultragraphdb_error_num" }
ultragraphdb_error_options = { path = "ultragraphdb_error/ultragraphdb_error_options" }
ultragraphdb_error_store = { path = "ultragraphdb_error/ultragraphdb_error_store" }
## Proto
ultragraphdb_proto_dgraph = { path = "ultragraphdb_proto/ultragraphdb_proto_dgraph" }
ultragraphdb_proto_pb = { path = "ultragraphdb_proto/ultragraphdb_proto_pb" }
## Store: storage over the Store trait
ultragraphdb_store_apply = { path = "ultragraphdb_store/ultragraphdb_store_apply" }
ultragraphdb_store_hnsw = { path = "ultragraphdb_store/ultragraphdb_store_hnsw" }
ultragraphdb_store_kv = { path = "ultragraphdb_store/ultragraphdb_store_kv" }
ultragraphdb_store_posting = { path = "ultragraphdb_store/ultragraphdb_store_posting" }
ultragraphdb_store_quads = { path = "ultragraphdb_store/ultragraphdb_store_quads" }
ultragraphdb_store_sim = { path = "ultragraphdb_store/ultragraphdb_store_sim" }
## Test
ultragraphdb_test_bdd = { path = "ultragraphdb_test/ultragraphdb_test_bdd" }
## Traits
ultragraphdb_traits_collator = { path = "ultragraphdb_traits/ultragraphdb_traits_collator" }
ultragraphdb_traits_index = { path = "ultragraphdb_traits/ultragraphdb_traits_index" }
ultragraphdb_traits_store = { path = "ultragraphdb_traits/ultragraphdb_traits_store" }

# ==============
# External crates
# ==============
prost = "0.14"
serde_json = "1.0"
tokio = "1"
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
# Byte-exact formats of the ported packages (stage 1 design, "External libraries for the byte-exact formats").
bcrypt = "0.19"
blake2 = "0.11"
dashu-base = "0.6"
dashu-int = "0.6"
rust-stemmers = "1.2"
serde = { version = "1.0", features = ["derive"] }
unicode-normalization = "0.1"
# The RDF term model and XSD values beneath the term dictionary (stage 4 design, "Crates"): pure Rust, MIT OR
# Apache-2.0. `rdf-12` gives the directional language-tagged strings RDF 1.2 adds.
oxrdf = { version = "0.3.5", features = ["rdf-12"] }
oxsdatatypes = "0.2.4"
# Structured logging; library crates emit events and never install a subscriber.
tracing = "0.1"
# Telemetry, installed once by a binary through ultragraphdb_common_telemetry: the 0.33 OpenTelemetry release
# train, tracing-opentelemetry 0.34 built on it, the OTLP span exporter over tonic 0.14 and prost 0.14.
tracing-subscriber = { version = "0.3.23", features = ["fmt", "json", "env-filter"] }
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["grpc-tonic", "trace"] }
tracing-opentelemetry = { version = "0.34.0", default-features = false }
# fjall is pinned exactly for its #[doc(hidden)] major_compact and
# rotate_memtable_and_wait, which Store::compact calls.
fjall = "=3.1.12"
moka = { version = "0.12.16", features = ["sync"] }
# Test-only: BDD scenarios from the specs, run without the libtest harness.
cucumber = "0.23"
futures = "0.3"
# Bench-only: criterion 0.7.0, the newest release without `alloca`, whose build script compiles C (0.8 added it);
# no default features, so no plotters, no rayon and no async runtimes.
criterion = { version = "0.7.0", default-features = false }


[workspace.lints.clippy]
all = "warn"
# Repo-wide lint policy. Member crates opt in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"
deprecated_safe = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
# unwind preserves drop, which is critical for security code relying on drop.
panic = "unwind"
