[package]
name = "ultragraphdb_transport_tls"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
autotests = false

[lints]
workspace = true

[features]
# A test certificate authority and a server certificate it issued, generated per run, for the tests of every crate
# that opens a verified connection.
test-utils = ["dep:rcgen"]

[dependencies]
rcgen = { workspace = true, optional = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }

[dev-dependencies]
ultragraphdb_transport_tls = { workspace = true, features = ["test-utils"] }
ultragraphdb_tool_bdd = { workspace = true }
cucumber = { workspace = true }
futures = { workspace = true }

[[test]]
name = "unit"
path = "tests/mod.rs"

[[test]]
name = "bdd"
path = "tests/bdd.rs"
harness = false
