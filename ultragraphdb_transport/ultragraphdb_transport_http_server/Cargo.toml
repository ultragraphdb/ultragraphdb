[package]
name = "ultragraphdb_transport_http_server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The HTTP/1.1 server of UltraGraphDB's control plane"
publish.workspace = true
autotests = false

[lints]
workspace = true

[dependencies]

ultragraphdb_protocol_transport_compio = { workspace = true }
ultragraphdb_transport_tls = { workspace = true }
# External crates
compio = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
ultragraphdb_protocol_transport = { workspace = true }
ultragraphdb_tool_bdd = { workspace = true }
ultragraphdb_transport_tls = { workspace = true, features = ["test-utils"] }

[[test]]
name = "unit"
path = "tests/mod.rs"
