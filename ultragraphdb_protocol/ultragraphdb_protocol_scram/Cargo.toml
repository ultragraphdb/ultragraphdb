[package]
name = "ultragraphdb_protocol_scram"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
autotests = false

[lints]
workspace = true

[dependencies]
ultragraphdb_protocol_transport = { workspace = true }
# External crates
base64 = { workspace = true, features = ["alloc"] }
getrandom = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
stringprep = { workspace = true }
subtle = { workspace = true }

[dev-dependencies]
ultragraphdb_protocol_wire = { workspace = true }
ultragraphdb_tool_bdd = { workspace = true }
# External crates
cucumber = { workspace = true }
futures = { workspace = true }
hegeltest = { workspace = true, features = ["static-engine"] }

[[test]]
name = "unit"
path = "tests/mod.rs"

[[test]]
name = "property"
path = "tests/property/mod.rs"

[[test]]
name = "bdd"
path = "tests/bdd.rs"
harness = false
