[package]
name = "ultragraphdb_client"
version = "0.1.0"
description = "Rust client for ultragraphdb and Dgraph, over Dgraph's gRPC API"
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
autotests = false

[lints]
workspace = true

[features]
default = []
# The acceptance fixture in `src/utils_test`. Off by default so a consumer of the client does
# not compile a Docker client, an HTTP agent and a JSON parser it will never call. `cargo test`
# runs the client's own unit tests without it; `cargo test --features test-utils` adds the
# fixture's tests and the acceptance test.
test-utils = ["dep:docker_utils", "dep:serde_json", "dep:ureq"]

[dependencies]
# In-repo protobuf bindings. Internal dependency only.
ultragraphdb_proto_dgraph = { workspace = true }
# tls-ring provides ClientTlsConfig; tls-native-roots provides the system trust store used by sslmode=verify-ca.
tonic = { workspace = true, features = ["tls-ring", "tls-native-roots"] }
rustls = { workspace = true, features = ["ring"] }
prost = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

# --- test-utils only ---------------------------------------------------------
# Local provisioning. Never reached by the `existing` strategy.
docker_utils = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }

# The client's own unit tests: types, parsing and error mapping. No feature, no infrastructure.
[[test]]
name = "lib_tests"
path = "tests/lib_tests.rs"

# The fixture's own unit tests: the strategy branch, the endpoint contract, the health report
# parser and the error surface. Still pure logic -- no Docker, no network -- but the code under
# test only exists with the feature on.
[[test]]
name = "utils_test_tests"
path = "tests/utils_test_tests.rs"
required-features = ["test-utils"]

# Needs a running Dgraph: a Docker daemon, or one already serving.
[[test]]
name = "dgraph_container_test"
path = "tests/dgraph_container_test.rs"
required-features = ["test-utils"]
