[package]
name = "ultragraphdb_client_tokio"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
autotests = false

[lints]
workspace = true

[dependencies]
ultragraphdb_client_core = { workspace = true }
ultragraphdb_protocol_transport = { workspace = true }
ultragraphdb_protocol_wire = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "time"] }

[dev-dependencies]
ultragraphdb_client_core = { workspace = true, features = ["test-utils"] }
ultragraphdb_protocol_scram = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "time", "rt"] }

[[test]]
name = "unit"
path = "tests/mod.rs"
