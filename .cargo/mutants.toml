    # before `check` reads it), so it is one ASCII scalar value, and an ASCII byte ahead of any byte sequence leaves
    # `str::from_utf8`'s verdict on the rest unchanged: it is a complete character and no continuation byte can follow
    # it as part of it. The verdict is the only use of the slice.
