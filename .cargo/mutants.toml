# cargo-mutants configuration, read by scripts/mutants.sh (approved as an exception to Bazel-only for mutation testing).
#
# Each entry is a REGULAR EXPRESSION matched against a mutant's description (`<file>:<line>:<col>: replace ...`), so
# `+`, `*`, `|`, `(`, `)`, `[`, `]`, `?`, `.` and `^` are escaped (`\\+` and so on): a bare `+` matches nothing and a
# bare `||` matches every mutant. Each entry excludes an equivalent mutant and carries the argument or measurement
# that settles it. After adding or moving one, check what the file excludes:
#
#     printf 'exclude_re = []\n' > /tmp/none.toml
#     cargo mutants --list -p <crate> --config /tmp/none.toml | sort > /tmp/all.txt
#     cargo mutants --list -p <crate> --config .cargo/mutants.toml | sort > /tmp/kept.txt
#     comm -23 /tmp/all.txt /tmp/kept.txt
#
# The last command prints exactly the excluded mutants: an entry on no line of it does nothing, and an entry pulling
# in more than it argues for hides caught mutants. Entries anchored by line say so; the check shows them matching
# nothing once their file moves.

