#
# The cargo-fuzz package of ultragraphdb_store_quads, run by scripts/fuzz.sh; a member of the fuzz workspace in fuzz/.
# Its targets call the crate's public decoders only.

[package]
name = "ultragraphdb_store_quads_fuzz"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata]
cargo-fuzz = true

[lints]
workspace = true

[dependencies]
libfuzzer-sys = { workspace = true }
ultragraphdb_core_ids = { workspace = true }
ultragraphdb_store_quads = { workspace = true }

# Any bytes as a stored referrer set: decoded or refused as corrupted, never a panic; an accepted set encodes back to
# its bytes, its members strictly sorted, and the generation rule holds on it.
[[bin]]
name = "referrer_set_decode"
path = "fuzz_targets/referrer_set_decode.rs"
test = false
doc = false
bench = false
