#
# The cargo-fuzz package of ultragraphdb_client_core, run by scripts/fuzz.sh; a member of the fuzz workspace in fuzz/.
# Its targets call the crate's public API only.

[package]
name = "ultragraphdb_client_core_fuzz"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata]
cargo-fuzz = true

[lints]
workspace = true

[dependencies]
libfuzzer-sys = { workspace = true }
ultragraphdb_client_core = { workspace = true }
ultragraphdb_protocol_transport = { workspace = true }
ultragraphdb_protocol_wire = { workspace = true }

# Any bytes as a frame from the server, received by a client waiting on every kind of reply and a result stream:
# accepted or refused with a typed error, never a panic; a refused frame leaves the client disconnected.
[[bin]]
name = "reply"
path = "fuzz_targets/reply.rs"
test = false
doc = false
bench = false
