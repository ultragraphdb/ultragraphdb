#
# The workspace of the cargo-fuzz packages, one per fuzzed crate, run by scripts/fuzz.sh. A workspace of its own, which
# the root workspace excludes and Bazel never builds: the targets need a nightly toolchain, and libfuzzer-sys compiles
# libFuzzer's C++, which no shipped crate may depend on. Inside it the repository's convention holds: every dependency
# is pinned once here and declared `{ workspace = true }` by the packages. The external pins repeat the root
# workspace's, so a fuzz target and the crate it calls build against the same versions.

[workspace]
resolver = "2"
members = ["ultragraphdb_*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# ==============
# Internal crates: the fuzzed crates and the errors their decoders return
# ==============
ultragraphdb_core_codec = { path = "../ultragraphdb_core/ultragraphdb_core_codec" }
ultragraphdb_core_mapping = { path = "../ultragraphdb_core/ultragraphdb_core_mapping" }
ultragraphdb_core_terms = { path = "../ultragraphdb_core/ultragraphdb_core_terms" }
ultragraphdb_error_log = { path = "../ultragraphdb_error/ultragraphdb_error_log" }
ultragraphdb_error_protocol = { path = "../ultragraphdb_error/ultragraphdb_error_protocol" }
ultragraphdb_error_store = { path = "../ultragraphdb_error/ultragraphdb_error_store" }
ultragraphdb_protocol_bus = { path = "../ultragraphdb_protocol/ultragraphdb_protocol_bus" }
ultragraphdb_protocol_wire = { path = "../ultragraphdb_protocol/ultragraphdb_protocol_wire" }
ultragraphdb_traits_log = { path = "../ultragraphdb_traits/ultragraphdb_traits_log" }
ultragraphdb_transactions_log = { path = "../ultragraphdb_transactions/ultragraphdb_transactions_log" }

# ==============
# External crates
# ==============
# libFuzzer's driver; its `arbitrary` is the one below.
libfuzzer-sys = "=0.4.13"
# The root workspace's pins.
arbitrary = { version = "1.5.0", features = ["derive"] }
compio = { version = "0.19", default-features = false, features = ["runtime", "io-uring", "fs", "net", "time"] }
oxrdf = { version = "0.3", features = ["rdf-12"] }
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

# Clippy as in the root workspace. `unsafe_code` cannot be forbidden here: `fuzz_target!` expands to `#[no_mangle]`.
[workspace.lints.clippy]
all = "warn"
