#
# The cargo-fuzz package of ultragraphdb_protocol_scram, run by scripts/fuzz.sh; a member of the fuzz workspace in
# fuzz/. Its targets call the crate's public API only.

[package]
name = "ultragraphdb_protocol_scram_fuzz"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata]
cargo-fuzz = true

[lints]
workspace = true

[dependencies]
libfuzzer-sys = { workspace = true }
ultragraphdb_protocol_scram = { workspace = true }

# Any bytes as a client's two messages, answered by a server holding RFC 7677's user: refused, or a server-first and
# server-final message that only the user's proof earns.
[[bin]]
name = "scram_server"
path = "fuzz_targets/scram_server.rs"
test = false
doc = false
bench = false

# Any bytes as a server's two messages, read by RFC 7677's client: refused, or a client-final message answering the
# server's nonce.
[[bin]]
name = "scram_client"
path = "fuzz_targets/scram_client.rs"
test = false
doc = false
bench = false

# Any bytes as a client-first-message, read by the endpoint's half of a server's exchange: refused as the server
# refuses it, or the name the server looks up and the server-first-message it builds.
[[bin]]
name = "scram_relay_first"
path = "fuzz_targets/scram_relay_first.rs"
test = false
doc = false
bench = false

# Any bytes as a client-final-message after RFC 7677's first two messages, read by the endpoint's half: refused as the
# server refuses it, or the AuthMessage and proof whose signature decides the server's answer.
[[bin]]
name = "scram_relay_last"
path = "fuzz_targets/scram_relay_last.rs"
test = false
doc = false
bench = false
