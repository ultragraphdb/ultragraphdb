#
# The cargo-fuzz package of ultragraphdb_common_config, run by scripts/fuzz.sh; a member of the fuzz workspace in fuzz/.
# Its targets call the crate's public decoders only.

[package]
name = "ultragraphdb_common_config_fuzz"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata]
cargo-fuzz = true

[lints]
workspace = true

[dependencies]
libfuzzer-sys = { workspace = true }
ultragraphdb_common_config = { workspace = true }

# Any bytes a stored round holds: a record, or a refusal saying why not.
[[bin]]
name = "config_record"
path = "fuzz_targets/config_record.rs"
test = false
doc = false
bench = false
