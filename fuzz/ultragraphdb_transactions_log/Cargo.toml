#
# The cargo-fuzz package of ultragraphdb_transactions_log, run by scripts/fuzz.sh; a member of the fuzz workspace in
# fuzz/. Its targets call the crate's public decoders only.

[package]
name = "ultragraphdb_transactions_log_fuzz"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata]
cargo-fuzz = true

[lints]
workspace = true

[dependencies]
arbitrary = { workspace = true }
libfuzzer-sys = { workspace = true }
ultragraphdb_error_log = { workspace = true }
ultragraphdb_protocol_wire = { workspace = true }
ultragraphdb_traits_log = { workspace = true }
ultragraphdb_transactions_log = { workspace = true }

# Any bytes as a segment: the scan never panics and never accepts a round whose checksums fail or that breaks the
# chain; the probe for a complete round agrees.
[[bin]]
name = "scan"
path = "fuzz_targets/scan.rs"
test = false
doc = false
bench = false

# Any bytes as a superblock copy: decoded or refused, never a panic; an accepted record re-encodes to the same bytes.
[[bin]]
name = "superblock"
path = "fuzz_targets/superblock.rs"
test = false
doc = false
bench = false
