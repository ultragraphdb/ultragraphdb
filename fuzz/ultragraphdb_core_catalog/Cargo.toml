#
# The cargo-fuzz package of ultragraphdb_core_catalog, run by scripts/fuzz.sh; a member of the fuzz workspace in fuzz/.
# Its targets call the crate's public decoders only.

[package]
name = "ultragraphdb_core_catalog_fuzz"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata]
cargo-fuzz = true

[lints]
workspace = true

[dependencies]
libfuzzer-sys = { workspace = true }
ultragraphdb_core_catalog = { workspace = true }

# Any bytes as a catalog version's contents, as the metadata group hands them to a partition: decoded, or refused as
# a corrupted version naming the namespace and version asked for, never a panic; accepted contents encode back to
# their bytes.
[[bin]]
name = "catalog_contents_decode"
path = "fuzz_targets/catalog_contents_decode.rs"
test = false
doc = false
bench = false
