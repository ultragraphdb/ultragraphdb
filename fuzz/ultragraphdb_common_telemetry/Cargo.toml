#
# The cargo-fuzz package of ultragraphdb_common_telemetry, run by scripts/fuzz.sh; a member of the fuzz workspace in
# fuzz/. Its targets call the crate's public decoders only.

[package]
name = "ultragraphdb_common_telemetry_fuzz"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata]
cargo-fuzz = true

[lints]
workspace = true

[dependencies]
libfuzzer-sys = { workspace = true }
ultragraphdb_common_telemetry = { workspace = true }

# Any bytes as a collector's HTTP/1.1 response: decoded or refused, never a panic; a body never longer than its input,
# and one framed by Content-Length exactly as long as announced.
[[bin]]
name = "http_response_decode"
path = "fuzz_targets/http_response_decode.rs"
test = false
doc = false
bench = false
