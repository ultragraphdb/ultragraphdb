#
# The cargo-fuzz package of ultragraphdb_transport_http_server, run by scripts/fuzz.sh; a member of the fuzz workspace in fuzz/.
# Its targets call the crate's public decoders only.

[package]
name = "ultragraphdb_transport_http_server_fuzz"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata]
cargo-fuzz = true

[lints]
workspace = true

[dependencies]
libfuzzer-sys = { workspace = true }
ultragraphdb_transport_http_server = { workspace = true }

# Any bytes on an HTTP listener: an answer that is a complete HTTP response, and a request's
# outcome unchanged by what follows its headers.
[[bin]]
name = "http_request"
path = "fuzz_targets/http_request.rs"
test = false
doc = false
bench = false
