#
# The cargo-fuzz package of ultragraphdb_protocol_wire, run by scripts/fuzz.sh; a member of the fuzz workspace in fuzz/.
# Its targets call the crate's public decoders only.

[package]
name = "ultragraphdb_protocol_wire_fuzz"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata]
cargo-fuzz = true

[lints]
workspace = true

[dependencies]
arbitrary = { workspace = true }
libfuzzer-sys = { workspace = true }
oxrdf = { workspace = true }
ultragraphdb_core_mapping = { workspace = true }
ultragraphdb_core_terms = { workspace = true }
ultragraphdb_error_protocol = { workspace = true }
ultragraphdb_protocol_wire = { workspace = true }

# Every frame a receiver gets: validated, and when accepted rebuilt to the same bytes.
[[bin]]
name = "frame"
path = "fuzz_targets/frame.rs"
test = false
doc = false
bench = false

# A body and its checksum_body: the chunk table and chunks checked, and when accepted re-encoded to the same bytes.
[[bin]]
name = "chunk_table"
path = "fuzz_targets/chunk_table.rs"
test = false
doc = false
bench = false

# Structure-aware: a valid frame built from arbitrary fields, header rules broken on purpose and resealed so the
# checks after the checksum are reached, then arbitrary mutations.
[[bin]]
name = "frame_fields"
path = "fuzz_targets/frame_fields.rs"
test = false
doc = false
bench = false

# Every command's body through its view: never a panic, and an accepted body rebuilds its frame.
[[bin]]
name = "body"
path = "fuzz_targets/body.rs"
test = false
doc = false
bench = false

# A Round body: decisions, the record table and each write-set record; the naming of damaged transactions.
[[bin]]
name = "round"
path = "fuzz_targets/round.rs"
test = false
doc = false
bench = false

# Any bytes as a write-set record: refused, or encoded again to the same bytes.
[[bin]]
name = "write_set_record"
path = "fuzz_targets/write_set_record.rs"
test = false
doc = false
bench = false

# Quad patterns with parameters: Prepare then Execute through the statement cache.
[[bin]]
name = "quad_pattern"
path = "fuzz_targets/quad_pattern.rs"
test = false
doc = false
bench = false

# Structure-aware: bodies of every kind built from arbitrary fields, then their bodies mutated.
[[bin]]
name = "body_fields"
path = "fuzz_targets/body_fields.rs"
test = false
doc = false
bench = false
