#
# The cargo-fuzz package of ultragraphdb_protocol_transport, run by scripts/fuzz.sh; a member of the fuzz workspace in fuzz/.
# Its targets call the crate's public decoders only.

[package]
name = "ultragraphdb_protocol_transport_fuzz"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata]
cargo-fuzz = true

[lints]
workspace = true

[dependencies]
libfuzzer-sys = { workspace = true }
ultragraphdb_error_protocol = { workspace = true }
ultragraphdb_protocol_scram = { workspace = true }
ultragraphdb_protocol_transport = { workspace = true }
ultragraphdb_protocol_wire = { workspace = true }

# Any bytes as a connection's stream, delivered in chunks: frames are read whole or refused, never a panic.
[[bin]]
name = "framing"
path = "fuzz_targets/framing.rs"
test = false
doc = false
bench = false

# Any bytes as a client's frames on one connection, taken by the server's connection machine with and without
# authentication: requests only on open streams, frames sent in order, nothing after the closing Error, never a panic.
[[bin]]
name = "server_connection"
path = "fuzz_targets/server_connection.rs"
test = false
doc = false
bench = false
